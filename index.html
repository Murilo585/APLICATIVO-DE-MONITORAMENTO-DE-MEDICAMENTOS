<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Monitoramento de Medicamentos</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background-color: #f4f6f9;
    }

    header {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card {
      border: none;
      border-radius: 16px;
    }

    h1, h2 {
      font-weight: bold;
    }

    .list-group-item {
      border-radius: 10px !important;
      margin-bottom: 10px;
    }

    .background-pills {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .background-pills span {
      position: absolute;
      opacity: 0.08;
      font-size: 80px;
    }

    .pill1 {
      top: 15%;
      left: 8%;
    }

    .pill2 {
      top: 35%;
      right: 10%;
    }

    .pill3 {
      bottom: 20%;
      left: 15%;
    }

    .pill4 {
      bottom: 10%;
      right: 20%;
    }
  </style>
</head>

<body>

  <!-- Pílulas no fundo -->
  <div class="background-pills">
    <span class="pill1">💊</span>
    <span class="pill2">💊</span>
    <span class="pill3">💊</span>
    <span class="pill4">💊</span>
  </div>

  <!-- Cabeçalho -->
  <header class="bg-primary text-white text-center p-4">
    <h1>
      <i class="bi bi-capsule-pill"></i>
      Monitoramento de Medicamentos
    </h1>
  </header>

  <main class="container mt-5">

    <!-- Cadastro -->
    <section class="card p-4 shadow">

      <h2 class="mb-4">
        <i class="bi bi-plus-circle"></i>
        Cadastrar Medicamento
      </h2>

      <form id="medForm">

        <div class="mb-3">
          <label class="form-label">
            Nome do medicamento
          </label>

          <input
            type="text"
            class="form-control"
            id="nome"
            placeholder="Ex: Dipirona"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label">
            Dosagem
          </label>

          <input
            type="text"
            class="form-control"
            id="dosagem"
            placeholder="Ex: 500mg"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label">
            Horário
          </label>

          <input
            type="time"
            class="form-control"
            id="horario"
            required
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
        >
          <i class="bi bi-save"></i>
          Salvar Medicamento
        </button>

      </form>

    </section>

    <!-- Lista -->
    <section class="mt-5">

      <h2>
        <i class="bi bi-list-check"></i>
        Medicamentos cadastrados
      </h2>

      <ul
        id="listaMedicamentos"
        class="list-group mt-3"
      ></ul>

    </section>

  </main>

  <!-- Nosso JavaScript -->
  <script src="script.js"></script>

</body>
</html>
