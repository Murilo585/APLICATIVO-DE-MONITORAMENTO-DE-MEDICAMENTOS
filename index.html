<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Monitoramento de Medicamentos</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="bg-primary text-white text-center p-4">
    <h1>Monitoramento de Medicamentos</h1>
  </header>

  <main class="container mt-5">

    <section class="card p-4 shadow">

      <h2 class="mb-4">Cadastrar Medicamento</h2>

      <form id="medForm">

        <div class="mb-3">
          <label class="form-label">Nome do medicamento</label>

          <input
            type="text"
            class="form-control"
            id="nome"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Dosagem</label>

          <input
            type="text"
            class="form-control"
            id="dosagem"
            required
          >
        </div>

        <div class="mb-3">
          <label class="form-label">Horário</label>

          <input
            type="time"
            class="form-control"
            id="horario"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary">
          Salvar Medicamento
        </button>

      </form>

    </section>

    <section class="mt-5">

      <h2>Medicamentos cadastrados</h2>

      <ul
        id="listaMedicamentos"
        class="list-group mt-3"
      >
      </ul>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
